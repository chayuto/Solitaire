packages:
  - packages/*

# Dependency lifecycle/build scripts are blocked by default in pnpm 10+.
# esbuild needs its postinstall to materialise the platform binary Vite uses.
# `allowBuilds` is the pnpm 11 approval mechanism; `onlyBuiltDependencies`
# is kept for compatibility with pnpm 10 tooling.
allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild
