name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "docs/**"
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "docs/**"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Run ESLint (app + libs)
        run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Typecheck all packages
        run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Run app tests (with coverage thresholds)
        run: pnpm --filter app test:coverage

      - name: Run library tests (with coverage thresholds)
        run: pnpm --filter @chayuto/solitaire-core test:coverage && pnpm --filter @chayuto/solitaire-mcts test

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            packages/app/coverage/
            packages/core/coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Build project
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/app/dist/
          retention-days: 7

  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Read @playwright/test version
        id: read
        run: |
          version="$(node -p "require('./packages/app/package.json').devDependencies['@playwright/test'].replace(/^[^0-9]*/, '')")"
          if [ -z "$version" ]; then
            echo "could not read @playwright/test version from packages/app/package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: playwright-version
    # Run inside the official Playwright image: chromium, the headless shell,
    # ffmpeg and every OS dependency are baked in, so there is NO
    # `playwright install` download step — the CDN stall that used to hang this
    # job can't happen. The image tag is derived from the @playwright/test
    # version in packages/app/package.json by the playwright-version job, so
    # the two can never drift (ADR-0004, amended 2026-07).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    # Safety cap; with no browser download the job is fast (~2-3 min).
    timeout-minutes: 20
    env:
      # Where the image stores its preinstalled browsers.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/app/playwright-report/
          retention-days: 7
