name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "docs/**"
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "docs/**"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build libraries
        run: pnpm run build:libs
      
      - name: Run ESLint
        run: pnpm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build libraries
        run: pnpm run build:libs
      
      - name: Run tests
        run: pnpm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build libraries
        run: pnpm run build:libs
      
      - name: Build project
        run: pnpm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Run inside the official Playwright image: chromium, the headless shell,
    # ffmpeg and every OS dependency are baked in, so there is NO
    # `playwright install` download step — the CDN stall that used to hang this
    # job can't happen. Keep this tag in lockstep with the @playwright/test
    # version in packages/app/package.json (currently 1.59.1); a mismatch makes
    # Playwright fall back to downloading the browser again.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    # Safety cap; with no browser download the job is fast (~2-3 min).
    timeout-minutes: 20
    env:
      # Where the image stores its preinstalled browsers.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        run: pnpm run build:libs

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/app/playwright-report/
          retention-days: 7
