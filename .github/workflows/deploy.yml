name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:run

      - name: Build
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './packages/app/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Read @playwright/test version
        id: read
        run: |
          version="$(node -p "require('./packages/app/package.json').devDependencies['@playwright/test'].replace(/^[^0-9]*/, '')")"
          if [ -z "$version" ]; then
            echo "could not read @playwright/test version from packages/app/package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: [deploy, playwright-version]
    # Run inside the official Playwright image: chromium, the headless shell,
    # ffmpeg and every OS dependency are baked in, so there is NO
    # `playwright install` download step — the CDN stall that used to hang this
    # job can't happen. The image tag is derived from the @playwright/test
    # version in packages/app/package.json by the playwright-version job, so
    # the two can never drift (ADR-0004, amended 2026-07). Mirrors the e2e job
    # in ci.yml.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    # Safety cap; with no browser download the job is fast.
    timeout-minutes: 20
    env:
      # Where the image stores its preinstalled browsers.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Run post-deploy smoke tests
        run: pnpm run test:e2e:deploy
        env:
          DEPLOY_URL: http://solitaire.chayuto.com/

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: post-deploy-report
          path: packages/app/playwright-report/
          retention-days: 7
