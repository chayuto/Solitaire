name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:run

      - name: Build
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './packages/app/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy
    # Run inside the official Playwright image: chromium, the headless shell,
    # ffmpeg and every OS dependency are baked in, so there is NO
    # `playwright install` download step — the CDN stall that used to hang this
    # job can't happen. The image tag must match the @playwright/test version
    # in packages/app/package.json (ADR-0004) — enforced by the lockstep guard
    # step below. Mirrors the e2e job in ci.yml.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    # Safety cap; with no browser download the job is fast.
    timeout-minutes: 20
    env:
      # Where the image stores its preinstalled browsers.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Playwright image/version lockstep
        run: node scripts/check-playwright-lockstep.mjs

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Run post-deploy smoke tests
        run: pnpm run test:e2e:deploy
        env:
          DEPLOY_URL: http://solitaire.chayuto.com/

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: post-deploy-report
          path: packages/app/playwright-report/
          retention-days: 7
